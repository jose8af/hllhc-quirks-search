# Geant4 from conda-forge (quirks v2, executor Basil, 2026-11-13): route 1 of task 5 (no source build).
[workspace]
name = "qv2-g4"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
geant4 = { version = "==11.4.3", build = "noqt*" }
cmake = "*"
make = "*"
cxx-compiler = "*"
expat = "*"            # headers: Geant4Config.cmake find_dependency(EXPAT >= 2.8.5); the system expat is 2.6.1
zlib = "*"             # headers: Geant4Config.cmake find_dependency(ZLIB >= 1.3.2); the system zlib is 1.3
freetype = "*"         # headers: Geant4Config.cmake find_dependency(Freetype >= 2.14.3) (runtime libfreetype only otherwise)
